name: 'CodeQL'

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 13 * * 6'

permissions: {}

jobs:
  codeql:
    uses: sei-jbooz/Crucible-Github-Actions/.github/workflows/codeql.yaml@feat/shared-codeql
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: javascript-typescript
